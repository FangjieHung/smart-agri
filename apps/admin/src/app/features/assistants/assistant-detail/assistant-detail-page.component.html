@if (configuration(); as assistant) {
  <section class="workspace-page">
    <app-page-header
      [title]="assistant.name"
      description="先選擇要處理的工作；其餘詳細設定會在後續畫面逐步完成。"
    >
      <a page-header-actions class="page-back" routerLink="/app/assistants">返回我的助理</a>
    </app-page-header>

    @if (justCreated) {
      <section class="created-banner" role="status" aria-labelledby="created-title">
        <h2 id="created-title">助理已建立</h2>
        <p>下一步建議設定發布管道，讓團隊或客戶開始使用；也可以先回到測試頁多試問幾題。</p>
        <a [routerLink]="['/app/assistants', assistantId(), 'publishing']">前往發布設定 <span aria-hidden="true">→</span></a>
      </section>
    }

    <nav class="tabs" aria-label="助理設定頁籤">
      @for (tab of tabs; track tab.id) {
        <a
          [routerLink]="['/app/assistants', assistantId(), tab.id]"
          [class.active]="tab.id === activeTab().id"
          [attr.aria-current]="tab.id === activeTab().id ? 'page' : null"
        >
          {{ tab.label }}
        </a>
      }
    </nav>

    <section class="placeholder-panel" [attr.aria-labelledby]="'tab-' + activeTab().id">
      <p class="placeholder-panel__eyebrow">助理設定</p>
      <h2 [id]="'tab-' + activeTab().id">{{ activeTab().label }}</h2>
      <p>{{ activeTab().placeholder }}</p>
    </section>
  </section>
} @else {
  <section class="workspace-page">
    <app-page-header title="無法檢視助理設定" description="這項設定只會顯示給助理擁有者。" />
    <app-state-panel
      state="permission-denied"
      title="你沒有這個助理的設定權限"
      description="若需要管理此助理，請由擁有者明確授權。"
      recoveryLabel="返回我的助理"
      (recover)="returnToList()"
    />
  </section>
}
