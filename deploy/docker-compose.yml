# Customer self-hosted deployment (see on-prem-packaging ADR): api + postgres, no
# monitoring services. Copy deploy/.env.example to deploy/.env and set a real
# POSTGRES_PASSWORD before running `docker compose -f deploy/docker-compose.yml up --build`.
# First install: create the first organization and administrator once with
# `docker compose -f deploy/docker-compose.yml run --rm api setup` (see apps/api/README.md,
# "First install").
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartagri}
      POSTGRES_USER: ${POSTGRES_USER:-smartagri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - smartagri-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smartagri} -d $${POSTGRES_DB:-smartagri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/src/SmartAgri.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-smartagri};Username=${POSTGRES_USER:-smartagri};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Token keys: outside Development the api refuses to start without both
      # certificates (see apps/api/README.md, "Sign-in and tokens"). Put the .pfx files
      # in deploy/certs/ (mounted read-only below).
      Authentication__SigningCertificatePath: /app/certs/signing.pfx
      Authentication__SigningCertificatePassword: ${AUTH_SIGNING_CERTIFICATE_PASSWORD:-}
      Authentication__EncryptionCertificatePath: /app/certs/encryption.pfx
      Authentication__EncryptionCertificatePassword: ${AUTH_ENCRYPTION_CERTIFICATE_PASSWORD:-}
      # Origin the admin SPA is served from; `migrate` registers {origin}/auth/callback.
      Authentication__AdminSpa__Origins__0: ${ADMIN_SPA_ORIGIN:-}
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smartagri-postgres-data:
