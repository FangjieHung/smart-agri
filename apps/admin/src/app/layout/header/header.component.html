<header class="topbar">
  <div class="flex items-center gap-2">
    <button mat-icon-button class="menu-toggle" type="button" aria-label="開啟導覽選單" (click)="menuToggle.emit()">
      <span class="material-symbols-rounded" aria-hidden="true">menu</span>
    </button>
    <nav class="breadcrumb" aria-label="目前位置">
      @if (currentGroupLabel()) {
        <span>{{ currentGroupLabel() }}</span>
        <span class="material-symbols-rounded breadcrumb-sep" aria-hidden="true">chevron_right</span>
      }
      <span aria-current="page">{{ currentTitle() }}</span>
    </nav>
  </div>

  @if (toolbarTemplate(); as toolbar) {
    <div class="topbar-toolbar">
      <ng-container [ngTemplateOutlet]="toolbar" />
    </div>
  }
</header>
