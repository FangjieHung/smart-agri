<section class="workspace-page">
  <app-page-header
    title="對話與回報紀錄"
    description="集中查看助理的使用情形，以及使用者同意提交的結構化資料。"
  />

  <section class="activity-card" aria-labelledby="activity-privacy-title">
    <h2 id="activity-privacy-title">這裡看得到什麼</h2>
    <p>
      對話屬於發起對話的帳號。助理建立者看不到其他帳號的提問與回答，只會看到不含對話文字的匿名統計。
      使用者同意提交的結構化資料則另外保存在資料庫的收集紀錄中。
    </p>
    <ul>
      <li>匿名使用統計：到各助理的「使用紀錄」頁籤查看。</li>
      <li>同意提交的資料：到「資料庫（數據收集）」的「收集紀錄」與「趨勢比較」頁籤查看。</li>
      <li>你自己的對話：到「和助理對話」，每段對話只保存在你的帳號。</li>
    </ul>
    <div class="activity-card__links">
      <a routerLink="/app/assistants">前往我的助理 <span aria-hidden="true">→</span></a>
      <a routerLink="/app/databases">前往資料庫 <span aria-hidden="true">→</span></a>
      <a routerLink="/app/chat">前往我的對話 <span aria-hidden="true">→</span></a>
    </div>
  </section>

  <p class="activity-note">
    這個彙整頁在 Demo 階段只提供入口說明；合併後的跨助理紀錄清單會在正式介接後實作。
  </p>
</section>
