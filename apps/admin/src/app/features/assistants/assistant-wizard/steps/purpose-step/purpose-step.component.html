@let draft = store.draft();
<div class="step">
  <fieldset class="group">
    <legend>從工作目的開始</legend>
    <p class="hint">模板只會預先填好設定，所有內容之後都可以修改。</p>
    <div class="choice-grid">
      @for (template of store.templates(); track template.id) {
        <label class="choice-card">
          <input
            type="radio"
            name="assistant-template"
            [value]="template.id"
            [checked]="draft.templateId === template.id"
            (change)="store.applyTemplate(template.id)"
          />
          <span class="choice-card__title">{{ template.title }}</span>
          <span class="choice-card__text">{{ template.description }}</span>
        </label>
      }
    </div>
  </fieldset>

  <app-assistant-profile-form
    [value]="profile()"
    [errors]="errors()"
    (changed)="apply($event)"
  />
</div>
