name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx build admin --configuration=production --base-href=/smart-agri/
      # SPA：直接開 /smart-agri/app/... 這類深層連結時 Pages 會回 404.html，
      # 讓它等於 index.html，交給 Angular router 處理。
      - run: cp dist/smart-agri-admin/browser/index.html dist/smart-agri-admin/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/smart-agri-admin/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
