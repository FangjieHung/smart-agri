@if (store.settings(); as settings) {
  <div class="step">
    <app-answer-rules-form
      [rules]="settings.rules"
      [writableDatabases]="store.writableDatabases()"
      [errors]="errors()"
      [live]="true"
      [autoDisabled]="settings.periodicReportAutoDisabled"
      [resuming]="store.busy()"
      (changed)="store.updateRules($event)"
      (resumeReport)="store.resumePeriodicReport()"
    />
  </div>
}
