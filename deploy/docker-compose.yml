# Customer self-hosted deployment (see on-prem-packaging ADR): api + postgres, no
# monitoring services. Copy deploy/.env.example to deploy/.env and set a real
# POSTGRES_PASSWORD before running `docker compose -f deploy/docker-compose.yml up --build`.
# First install: create the first organization and administrator once with
# `docker compose -f deploy/docker-compose.yml run --rm api setup` (see apps/api/README.md,
# "First install").
# Explicit project name: both compose files live in deploy/, so without it they would both
# default to the project "deploy" and one stack's `up` would take over the other's postgres.
name: smartagri

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartagri}
      POSTGRES_USER: ${POSTGRES_USER:-smartagri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory of /var/lib/postgresql
      # (PGDATA=/var/lib/postgresql/18/docker) and refuse to start when a volume is mounted
      # at the old /var/lib/postgresql/data path, even an empty one.
      - smartagri-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smartagri} -d $${POSTGRES_DB:-smartagri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/src/SmartAgri.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-smartagri};Username=${POSTGRES_USER:-smartagri};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Token keys: outside Development the api refuses to start without both
      # certificates (see apps/api/README.md, "Sign-in and tokens"). Put the .pfx files
      # in deploy/certs/ (mounted read-only below).
      Authentication__SigningCertificatePath: /app/certs/signing.pfx
      Authentication__SigningCertificatePassword: ${AUTH_SIGNING_CERTIFICATE_PASSWORD:-}
      Authentication__EncryptionCertificatePath: /app/certs/encryption.pfx
      Authentication__EncryptionCertificatePassword: ${AUTH_ENCRYPTION_CERTIFICATE_PASSWORD:-}
      # Data Protection key ring (apps/api/README.md, "Data Protection key ring"): the keys behind
      # sign-in cookies and stored secret settings. Outside Development the api refuses to start
      # without the keys directory and the certificate that encrypts the key files. The directory
      # is the named volume below; back it up together with the database and the certificate.
      DataProtection__KeysPath: /app/keys
      DataProtection__CertificatePath: /app/certs/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:-}
      # Origin the admin SPA is served from; `migrate` registers {origin}/auth/callback.
      Authentication__AdminSpa__Origins__0: ${ADMIN_SPA_ORIGIN:-}
      # Embedding model (apps/api/README.md, "Embeddings and vector search"). Without a
      # provider the api starts but cannot process uploaded documents. Fake is refused here.
      Ai__Embedding__Provider: ${EMBEDDING_PROVIDER:-}
      Ai__Embedding__Endpoint: ${EMBEDDING_ENDPOINT:-}
      Ai__Embedding__Model: ${EMBEDDING_MODEL:-}
      Ai__Embedding__ApiKey: ${EMBEDDING_API_KEY:-}
      Ai__Embedding__DocumentPrefix: ${EMBEDDING_DOCUMENT_PREFIX:-}
      Ai__Embedding__QueryPrefix: ${EMBEDDING_QUERY_PREFIX:-}
      # Chat model (apps/api/README.md, "Chat model"). Without a provider the api starts but
      # every conversation answers 503 chat-not-configured. Fake is refused here. Blank
      # numeric values bind as "unset" (provider/client default), they do not fail startup.
      Ai__Chat__Provider: ${CHAT_PROVIDER:-}
      Ai__Chat__Endpoint: ${CHAT_ENDPOINT:-}
      Ai__Chat__Model: ${CHAT_MODEL:-}
      Ai__Chat__ApiKey: ${CHAT_API_KEY:-}
      Ai__Chat__MaxOutputTokens: ${CHAT_MAX_OUTPUT_TOKENS:-}
      Ai__Chat__TimeoutSeconds: ${CHAT_TIMEOUT_SECONDS:-}
      # None/Low/Medium/High/ExtraHigh. Reasoning models (e.g. gpt-6-luna) need None.
      Ai__Chat__ReasoningEffort: ${CHAT_REASONING_EFFORT:-}
      # The deployment default's id (what an organization's choice is stored as) and the name
      # people see in the settings; blank = the model name (deploy/README.md, section 11).
      Ai__Chat__Id: ${CHAT_ID:-}
      Ai__Chat__DisplayName: ${CHAT_DISPLAY_NAME:-}
      # A second chat model organizations may choose instead of the default (M6, deploy/README.md,
      # section 11). Blank CHAT_MODELS_0_PROVIDER = no second model: the entry is skipped.
      Ai__Chat__Models__0__Provider: ${CHAT_MODELS_0_PROVIDER:-}
      Ai__Chat__Models__0__Endpoint: ${CHAT_MODELS_0_ENDPOINT:-}
      Ai__Chat__Models__0__Model: ${CHAT_MODELS_0_MODEL:-}
      Ai__Chat__Models__0__ApiKey: ${CHAT_MODELS_0_API_KEY:-}
      Ai__Chat__Models__0__Id: ${CHAT_MODELS_0_ID:-}
      Ai__Chat__Models__0__DisplayName: ${CHAT_MODELS_0_DISPLAY_NAME:-}
      Ai__Chat__Models__0__MaxOutputTokens: ${CHAT_MODELS_0_MAX_OUTPUT_TOKENS:-}
      Ai__Chat__Models__0__TimeoutSeconds: ${CHAT_MODELS_0_TIMEOUT_SECONDS:-}
      Ai__Chat__Models__0__ReasoningEffort: ${CHAT_MODELS_0_REASONING_EFFORT:-}
      # Who decides whether a question gets the assistant's form: Model (the chat model picks,
      # keyword gate as fallback) or Keyword. Model is the customer-deploy default (#164 eval).
      Chat__FormRequests__Trigger: ${CHAT_FORM_REQUEST_TRIGGER:-Model}
      # IANA time zone whose calendar days the statistics queries and reports count in.
      Statistics__TimeZone: ${STATISTICS_TIME_ZONE:-Asia/Taipei}
      # Address visitors' browsers reach this api at (e.g. https://assistant.example.org); the
      # website embed code points at {PUBLIC_BASE_URL}/embed.js. Empty: no embed code, and
      # publishing a website channel is refused (apps/api/README.md, "Website channel").
      PublicChannels__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      # Chat-model tokens (input + output) an organization may use per month before its website
      # replies are suspended, when its own limit (the `set-token-limit` command) is unset. Blank =
      # the built-in 2,000,000 (apps/api/README.md, "Monthly token limit").
      PublicChannels__DefaultMonthlyTokenLimit: ${DEFAULT_MONTHLY_TOKEN_LIMIT:-}
      # IP addresses / CIDR networks of the reverse proxy in front of this api, comma separated (e.g.
      # 172.18.0.0/16,10.0.0.5). Only requests from them have X-Forwarded-* applied; blank = ignored, and
      # every visitor behind a proxy then shares one rate-limit IP (apps/api/README.md, "Behind a reverse proxy").
      PublicChannels__TrustedProxies__0: ${TRUSTED_PROXIES:-}
    volumes:
      - ./certs:/app/certs:ro
      - smartagri-dataprotection-keys:/app/keys
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smartagri-postgres-data:
  smartagri-dataprotection-keys:
