# Local development: only Postgres and the Aspire dashboard run in containers. The Api
# runs directly with `dotnet run` against them (see apps/api/README.md), so
# `ConnectionStrings__Default` is not set here — appsettings.Development.json already
# points at localhost:5432 with the same default credentials as below. Point the Api at
# the dashboard by setting `OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317` in the
# shell that runs `dotnet run` (see apps/api/README.md); traces are not exported anywhere
# unless that variable is set.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartagri}
      POSTGRES_USER: ${POSTGRES_USER:-smartagri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartagri_dev}
    ports:
      - "5432:5432"
    volumes:
      - smartagri-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smartagri} -d $${POSTGRES_DB:-smartagri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only OpenTelemetry viewer (observability ADR: never bundled with the customer
  # deploy — see deploy/docker-compose.yml). UI on :18888, OTLP/gRPC on :4317.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  smartagri-postgres-dev-data:
