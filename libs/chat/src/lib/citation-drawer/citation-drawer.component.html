<div class="backdrop" aria-hidden="true" (click)="closed.emit()"></div>
<section
  class="drawer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="citation-drawer-title"
  aria-describedby="citation-drawer-hint"
  cdkTrapFocus
  (keydown.escape)="closed.emit()"
>
  <!-- 不用 <header>：在 role="dialog" 裡 axe 會把它當成第二個 banner 地標（頁面本身的標題列已經是）。 -->
  <div class="drawer-header">
    <h2 id="citation-drawer-title">引用來源</h2>
    <button #closeButton type="button" class="drawer-close" (click)="closed.emit()">
      關閉<span class="visually-hidden">引用來源</span>
    </button>
  </div>
  <p id="citation-drawer-hint" class="hint">這則回答參考了以下組織資料的原文片段。</p>
  <ol class="citations">
    @for (citation of citations(); track citation.id) {
      <li>
        <p class="source">{{ citation.knowledgeBaseName }}</p>
        <p class="document">{{ citation.documentName }}</p>
        <blockquote>「{{ citation.excerpt }}」</blockquote>
        <p class="updated">更新日期：<time [attr.datetime]="citation.updatedLabel">{{ citation.updatedLabel }}</time></p>
      </li>
    }
  </ol>
</section>
