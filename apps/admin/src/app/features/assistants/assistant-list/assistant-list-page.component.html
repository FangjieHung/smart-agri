<section class="workspace-page">
  <app-page-header
    title="我的助理"
    description="查看你可使用的助理，或回到設定完成下一步。"
  >
    <a page-header-actions class="ui-button" routerLink="/app/assistants/new/purpose">建立新助理</a>
  </app-page-header>

  @if (items().length > 0) {
    <ul class="assistant-list" aria-label="可使用的 AI 助理">
      @for (item of items(); track item.assistant.id) {
        <li>
          <app-assistant-card
            [assistant]="item.assistant"
            [channels]="item.channels"
            [recentActivity]="item.recentActivity"
          />
        </li>
      }
    </ul>
  } @else {
    <section class="empty-list" aria-labelledby="empty-assistants-title">
      <p class="empty-list__eyebrow">尚未有可使用的助理</p>
      <h2 id="empty-assistants-title">從第一個工作目的開始</h2>
      <p>建立後即可連接資料來源、試問並決定如何發布。</p>
      <a class="ui-button" routerLink="/app/assistants/new/purpose">建立新助理</a>
    </section>
  }
</section>
