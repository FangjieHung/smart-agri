name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: tools/check-banned-packages.sh
      - run: tools/check-no-demo-secrets.sh
      - run: dotnet restore apps/api/SmartAgri.slnx --locked-mode
      - run: npx nx run-many -t lint test build
      - run: npx tsc -p apps/admin/tsconfig.spec.json --noEmit
      # 由 api 容器一起提供的 admin（上線前計畫 §3 E）用 production-api 建置；budgets 與 production 相同，
      # 超過 error 上限時這一步就失敗（超過 warning 只會印出警告）。輸出放在 runner 的暫存目錄，不覆蓋上一步產生的 dist/。
      - run: npx nx build admin --configuration=production-api --output-path=${{ runner.temp }}/admin-production-api
      # @ag-ui/client 解析後端 AG-UI 串流的錄製檔（#77）；錄製檔與端點實際輸出不一致時，
      # 上一步的 ChatRunEndpointsTests 就會失敗，所以兩步合起來確認前後端協定相容。
      - run: node tools/agui-contract/check-agui-stream.mjs
      - name: Check generated frontend types match apps/api/openapi/v1.json
        run: |
          npx nx run admin:api-types
          git diff --exit-code -- apps/api/openapi apps/admin/src/app/core/api

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # 放在 `npm ci` 之前：Cypress 的 postinstall 會檢查這個目錄，
      # cache 命中時就不必重新下載 binary。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      - run: npm ci
      # cypress.config.ts 不會被 `nx run-many -t lint test build` 的 admin-e2e:lint
      # 型別檢查（ESLint 只做語法／規則檢查，不會跑 tsc），所以另外用 tsc 直接驗證這個
      # e2e 專案沒有型別錯誤（包含 cypress.config.ts 本身）。
      - run: npx tsc -p apps/admin-e2e/tsconfig.json --noEmit
      # admin-e2e 的 e2e-ci 是給 Nx Cloud 分散執行用的「atomized」目標，這個repo
      # 沒有接 Nx Cloud，直接 `nx run admin-e2e:e2e-ci` 會被 Nx 擋下並提示
      # "should only be run with Nx Cloud"；改用未拆分的 e2e 目標，一次跑完全部
      # spec（production 設定＝mock 模式，4301 埠，不需要後端）。
      - run: npx nx run admin-e2e:e2e --configuration=production
      - name: Upload Cypress screenshots/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-cypress-artifacts
          path: dist/cypress/apps/admin-e2e/**
          retention-days: 7

  # API 模式的 E2E（M2 Slice 17，issue #51）：真實 API＋PostgreSQL（pgvector）＋背景工作 worker，
  # 嵌入與對話都用 `Fake`（不需要任何金鑰），admin 以 `api` configuration 經 dev-server proxy 提供，
  # 再跑 apps/admin-e2e/src/e2e-api/ 的 spec。與上面 mock 模式的 `e2e` job 互不重疊：
  # cypress.config.ts 只收 src/e2e/，cypress.api.config.ts 只收 src/e2e-api/。
  e2e-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      # CI 專用的公開測試值，只用在這個 job 自己的一次性服務容器；不是 secret，也不可用在任何真實資料庫。
      # tools/check-no-demo-secrets.sh 只容許 ci.yml 設定這一個值（做法見該腳本開頭的註解）。
      # migrate 用它建立示範帳號，Cypress 用它登入（cypress.api.config.ts 讀同一個環境變數）。
      SEED_DEMO_PASSWORD: 'Ci-E2e-Only-Pass-2026!'
    services:
      # 版本與 deploy/docker-compose.dev.yml 相同；帳密是 appsettings.Development.json 的開發預設值，
      # 所以 API 不必另外設定連線字串。
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: smartagri
          POSTGRES_USER: smartagri
          POSTGRES_PASSWORD: smartagri_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartagri -d smartagri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: dotnet restore apps/api/SmartAgri.slnx --locked-mode
      - run: dotnet build apps/api/src/SmartAgri.Api --no-restore
      # 訪客的對話視窗（apps/widget）由 API 自己提供（/use/{id}、/widget/*、/embed.js；M5a #201），
      # website-embed-api.cy.ts 要開它，所以先建置，API 以 Widget__RootPath 指到產出。
      - name: Build the chat window the API serves
        run: npx nx build widget --configuration=production
      # 套用 migration、註冊 admin-spa（redirect URI 用 Development 預設的 http://localhost:4200），
      # 並以 SEED_DEMO_PASSWORD 建立 安心商行（anxin）與 對照組織（control）的示範帳號。
      # 不設 SEED_DEMO_KNOWLEDGE：spec 自己建立並刪除它用到的知識庫。
      - name: Migrate and seed the demo accounts
        run: dotnet run --no-build --no-launch-profile --project apps/api/src/SmartAgri.Api -- migrate
      # 假的 LINE Messaging API（M5b #234）：API 的 Line__ApiBaseUrl 指到它，測試連線、reply、push 都不會連到
      # LINE；line-api.cy.ts 以它的控制 API（/__control/*）設定官方帳號、讀收到的 reply／push。只用 node 內建模組。
      - name: Start the fake LINE server in the background
        run: |
          nohup node tools/fake-line-server/server.mjs > "$RUNNER_TEMP/fake-line.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:5180/__control/health; then
              echo "fake LINE server is ready"; exit 0
            fi
            sleep 1
          done
          echo "fake LINE server did not become ready" >&2
          cat "$RUNNER_TEMP/fake-line.log" >&2
          exit 1
      - name: Start the API in the background
        env:
          ASPNETCORE_URLS: http://localhost:5153
          Ai__Embedding__Provider: Fake
          Ai__Embedding__Model: fake-dev
          Ai__Chat__Provider: Fake
          Ai__Chat__Model: fake-chat-dev
          # 第二個可選的 Fake 模型（M6 #244）：org-settings-api.cy.ts 換模型後檢查驗收頁的提示。只放在這一步：
          # 前面的 `dotnet build`（建置期產生 OpenAPI 不是 Development，讀不到 appsettings.Development.json 的
          # Ai:Chat）看到 Ai:Chat:Models 會因為缺少預設模型而失敗；這裡以 --no-build 啟動，不會重新建置。
          # Cypress 那一步用 cy.exec 跑的一次性子指令（set-token-limit、retention-cleanup）不需要它。
          Ai__Chat__Models__0__Provider: Fake
          Ai__Chat__Models__0__Model: fake-chat-second
          Ai__Chat__Models__0__Id: second
          Ai__Chat__Models__0__DisplayName: 第二個測試模型
          Jobs__WorkerEnabled: 'true'
          # 對話視窗與載入器（路徑同 Dockerfile 複製進 wwwroot 的來源）；嵌入碼與同源檢查用的對外網址。
          Widget__RootPath: ${{ github.workspace }}/dist/smart-agri-widget/browser
          Widget__EmbedScriptPath: ${{ github.workspace }}/apps/embed-loader/src/embed.js
          PublicChannels__PublicBaseUrl: http://localhost:5153
          # 非官方網址只在非 Production 允許（LineOptions.Validate）；這個 job 是 Development。
          Line__ApiBaseUrl: http://127.0.0.1:5180
        run: |
          nohup dotnet run --no-build --no-launch-profile --project apps/api/src/SmartAgri.Api \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 -o /dev/null http://localhost:5153/health/ready; then
              # 沒有 widget 建置時 /use/{id} 一律 503；未知的 id 應是固定的 404 頁。
              status=$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' \
                http://localhost:5153/use/00000000-0000-4000-8000-000000000000)
              if [ "$status" != 404 ]; then
                echo "the API does not serve the chat window (/use answered $status)" >&2
                tail -n 100 "$RUNNER_TEMP/api.log" >&2
                exit 1
              fi
              echo "API is ready"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          tail -n 100 "$RUNNER_TEMP/api.log" >&2
          exit 1
      # apps/admin/proxy.api.json 把 /api、/connect、/.well-known 轉給 5153，前端與 API 同源，
      # PKCE 登入不必跨網域。
      - name: Serve admin in API mode in the background
        run: |
          nohup npx nx run admin:serve:api --port=4200 > "$RUNNER_TEMP/admin.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 3 -o /dev/null http://localhost:4200/ \
              && curl -fsS --max-time 3 -o /dev/null http://localhost:4200/api/v1/auth/login-options; then
              echo "admin is being served and proxies to the API"; exit 0
            fi
            sleep 2
          done
          echo "admin dev server did not become ready" >&2
          tail -n 100 "$RUNNER_TEMP/admin.log" >&2
          exit 1
      - run: npx nx run admin-e2e:e2e-api
      - name: Upload Cypress screenshots and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-api-artifacts
          path: |
            dist/cypress/apps/admin-e2e-api/**
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/admin.log
            ${{ runner.temp }}/fake-line.log
          retention-days: 7
