@let chartPoints = plotted();
<figure class="trend-chart">
  <svg
    role="img"
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    [attr.aria-labelledby]="id + '-title ' + id + '-desc'"
    preserveAspectRatio="xMidYMid meet"
  >
    <title [id]="id + '-title'">{{ title() }}趨勢圖</title>
    <desc [id]="id + '-desc'">{{ summary() }}</desc>
    <line class="axis" [attr.x1]="pad.left" [attr.x2]="width - pad.right" [attr.y1]="height - pad.bottom" [attr.y2]="height - pad.bottom" />
    <line class="grid" [attr.x1]="pad.left" [attr.x2]="width - pad.right" [attr.y1]="pad.top" [attr.y2]="pad.top" />
    <text class="tick" [attr.x]="pad.left - 8" [attr.y]="pad.top + 4" text-anchor="end">{{ max() }}</text>
    <text class="tick" [attr.x]="pad.left - 8" [attr.y]="height - pad.bottom + 4" text-anchor="end">{{ min() }}</text>
    <polyline class="line" [attr.points]="line()" />
    @for (point of chartPoints; track $index; let first = $first, last = $last) {
      <circle [attr.cx]="point.x" [attr.cy]="point.y" r="4" [class.current]="last" />
      @if (first || last) {
        <text
          class="tick"
          [attr.x]="point.x"
          [attr.y]="height - pad.bottom + 18"
          [attr.text-anchor]="first && !last ? 'start' : 'end'"
        >{{ point.label }}</text>
      }
    }
  </svg>
  <figcaption>{{ summary() }}</figcaption>
  <table>
    <caption>{{ title() }}資料表</caption>
    <thead>
      <tr><th scope="col">日期</th><th scope="col">數值</th></tr>
    </thead>
    <tbody>
      @for (point of points(); track $index) {
        <tr><th scope="row">{{ point.label }}</th><td>{{ point.display }}</td></tr>
      }
    </tbody>
  </table>
</figure>
