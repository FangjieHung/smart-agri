@let item = document();
<div class="document-row" [class.document-row--attention]="needsAttention()">
  <div class="document-main">
    <span class="document-kind">{{ kindLabel() }}</span>
    <p class="document-name">{{ item.name }}</p>
    @if (item.issue) {
      <p class="document-issue">{{ item.issue }}</p>
    }
  </div>
  <span class="document-status" [attr.data-status]="item.status">
    <span aria-hidden="true">{{ status().symbol }}</span>
    <span>{{ status().label }}</span>
  </span>
  <time class="document-time" [attr.datetime]="item.updatedAt">{{ updatedAt() }}</time>
  @if (canManage()) {
    <div class="document-actions">
      @if (canRetry()) {
        <button type="button" class="document-retry" [disabled]="busy()" (click)="retry.emit(item)">
          重新處理<span class="visually-hidden">{{ item.name }}</span>
        </button>
      }
      <button type="button" class="document-remove" [disabled]="busy()" (click)="remove.emit(item)">
        刪除<span class="visually-hidden">{{ item.name }}</span>
      </button>
    </div>
  }
</div>
