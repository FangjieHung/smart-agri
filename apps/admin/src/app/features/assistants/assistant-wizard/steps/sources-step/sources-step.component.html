@let view = store.sourcesView();
@let sourcesError = store.fieldError('sources', 'sources');
<div class="step">
  <p class="hint">知識庫提供可引用的內容，資料庫負責收集與比較紀錄。加入只會建立連接，不會複製或修改原始資料。</p>

  @if (view.status === 'loading') {
    <app-state-panel state="loading" title="正在載入資料來源" />
  } @else if (view.status === 'permission-denied') {
    <app-state-panel state="permission-denied" title="無法讀取資料來源" [description]="view.message" />
  } @else {
    <app-source-connection-list
      [sources]="store.connectableSources()"
      [connected]="store.draft().sources"
      (toggled)="store.toggleSource($event)"
    />

    @if (sourcesError) {
      <p id="sources-error" class="error" role="alert">{{ sourcesError }}</p>
    }
  }
</div>
